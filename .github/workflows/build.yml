name: Build ADB Gripper Binaries (Rust)

on:
  push:
    branches: [ "rust" ]
    tags:
      - 'rust-v*'
  pull_request:
    branches: [ "rust" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bin_path: target/release/adb-gripper.exe
            asset_name: ADB-Gripper-Windows.exe
          - os: ubuntu-latest
            bin_path: target/release/adb-gripper
            asset_name: ADB-Gripper-Linux
          - os: macos-latest
            bin_path: target/release/adb-gripper
            asset_name: ADB-Gripper-MacOS

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.bin_path }}" "dist/${{ matrix.asset_name }}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.asset_name }}
